name: Deploy to Hetzner

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_torin
          chmod 600 ~/.ssh/id_torin
          ssh-keyscan -H 91.99.20.199 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_torin root@91.99.20.199 << 'DEPLOY'
            set -e
            cd /opt/tailor-application

            # Pull latest code
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/hamidraza8/tailor-app.git
            fi
            git fetch origin master
            git reset --hard origin/master

            # Rebuild and restart
            cd deployment
            docker compose up -d --build --remove-orphans

            # Cleanup old images
            docker image prune -f

            echo "Deployment complete!"
          DEPLOY
