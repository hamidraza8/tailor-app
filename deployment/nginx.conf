events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Rate limiting for SAJA store
    limit_req_zone $binary_remote_addr zone=saja_orders:10m rate=2r/s;

    upstream backend {
        server backend-api:5000;
    }

    upstream admin {
        server web-admin:80;
    }

    upstream saja {
        server saja-store:3000;
    }

    # ---- SAJA store (saja.torin.pk) ----
    server {
        listen 80;
        server_name saja.torin.pk;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name saja.torin.pk;

        ssl_certificate /etc/ssl/certs/saja.torin.pk.crt;
        ssl_certificate_key /etc/ssl/private/saja.torin.pk.key;

        # Order creation — stricter rate limit
        location /api/orders {
            limit_req zone=saja_orders burst=5 nodelay;
            proxy_pass http://saja;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other routes
        location / {
            proxy_pass http://saja;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Tailor app (torin.pk) ----
    server {
        listen 80;
        listen 443 ssl;
        server_name torin.pk www.torin.pk;

        ssl_certificate /etc/ssl/certs/torin.pk.crt;
        ssl_certificate_key /etc/ssl/private/torin.pk.key;

        # API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate limit login endpoint more strictly
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger
        location /swagger {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Web Admin
        location /admin {
            proxy_pass http://admin;
            proxy_set_header Host $host;
        }

        # Root -> Admin
        location / {
            proxy_pass http://admin;
            proxy_set_header Host $host;
        }
    }

}
