version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailorshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=${DATABASE_CONNECTION:-Host=postgres;Database=tailorshop;Username=postgres;Password=postgres}
      - Jwt__Secret=${JWT_SECRET:-super-secret-key-that-is-at-least-32-chars-long!!}
      - Jwt__Issuer=${JWT_ISSUER:-TailorShop}
      - Jwt__Audience=${JWT_AUDIENCE:-TailorShop}
      - Storage__Provider=${STORAGE_PROVIDER:-local}
      - Storage__LocalPath=${STORAGE_LOCAL_PATH:-/app/uploads}
      - Storage__BaseUrl=${STORAGE_BASE_URL:-/api/files}
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"

  web-admin:
    build:
      context: ../web-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend-api
      - web-admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  uploads_data:
  certbot_data:
  certbot_www:
