name: tailor_app
description: A friendly mobile app for ladies tailoring business management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  pdf: ^3.10.7
  printing: ^5.11.1
  connectivity_plus: ^5.0.2
  intl: ^0.18.1
  provider: ^6.1.1
  uuid: ^4.2.1
  google_fonts: ^6.1.0
  flutter_sound: ^9.2.13
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
